version: 1
dashboard:
  id: otel-kafka-consumer-offsets
  title: Kafka Consumer Offsets
  description: Consumer group offsets from the OTel Kafka metrics receiver.
  tags: [otel, kafka, kafkametrics, monitoring]
  vars:
    - name: group
      type: TAG_VALUE
      tag: group
    - name: topic
      type: TAG_VALUE
      tag: topic
    - name: partition
      type: TAG_VALUE
      tag: partition
  rows:
    - id: kafka-consumer-offsets
      title: Offsets
      panels:
        - id: consumer-group-offset
          title: Consumer Group Offset
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"kafka.consumer_group.offset","tags":{"group":"$__{group}","topic":"$__{topic}","partition":"$__{partition}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: consumer-group-offset-sum
          title: Consumer Group Offset Sum
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"kafka.consumer_group.offset_sum","tags":{"group":"$__{group}","topic":"$__{topic}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
