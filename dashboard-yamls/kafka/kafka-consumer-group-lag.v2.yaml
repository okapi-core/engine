version: 1
dashboard:
  id: otel-kafka-consumer-group-lag
  title: Kafka Consumer Group Lag
  description: Consumer lag and group health from the OTel Kafka metrics receiver.
  tags: [otel, kafka, kafkametrics, monitoring]
  vars:
    - name: group
      type: TAG_VALUE
      tag: group
    - name: topic
      type: TAG_VALUE
      tag: topic
    - name: partition
      type: TAG_VALUE
      tag: partition
  rows:
    - id: kafka-consumer-lag
      title: Lag
      panels:
        - id: consumer-group-lag
          title: Consumer Group Lag
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"kafka.consumer_group.lag","tags":{"group":"$__{group}","topic":"$__{topic}","partition":"$__{partition}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: consumer-group-lag-sum
          title: Consumer Group Lag Sum
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"kafka.consumer_group.lag_sum","tags":{"group":"$__{group}","topic":"$__{topic}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: consumer-group-members
          title: Consumer Group Members
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"kafka.consumer_group.members","tags":{"group":"$__{group}"},"metricType":"SUM","sumsQueryConfig":{"temporality":"CUMULATIVE"}}
