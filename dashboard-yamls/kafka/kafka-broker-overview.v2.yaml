version: 1
dashboard:
  id: otel-kafka-broker-overview
  title: Kafka Broker Overview
  description: Kafka broker, topic, and partition metrics from the OTel Kafka metrics receiver.
  tags: [otel, kafka, kafkametrics, monitoring]
  vars:
    - name: topic
      type: TAG_VALUE
      tag: topic
    - name: partition
      type: TAG_VALUE
      tag: partition
  rows:
    - id: kafka-cluster
      title: Cluster
      panels:
        - id: brokers
          title: Brokers
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"kafka.brokers","tags":{},"metricType":"SUM","sumsQueryConfig":{"temporality":"CUMULATIVE"}}
        - id: topic-partitions
          title: Topic Partitions
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"kafka.topic.partitions","tags":{"topic":"$__{topic}"},"metricType":"SUM","sumsQueryConfig":{"temporality":"CUMULATIVE"}}
    - id: kafka-partitions
      title: Partitions
      panels:
        - id: current-offset
          title: Current Offset
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"kafka.partition.current_offset","tags":{"topic":"$__{topic}","partition":"$__{partition}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: oldest-offset
          title: Oldest Offset
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"kafka.partition.oldest_offset","tags":{"topic":"$__{topic}","partition":"$__{partition}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: replicas
          title: Replicas
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"kafka.partition.replicas","tags":{"topic":"$__{topic}","partition":"$__{partition}"},"metricType":"SUM","sumsQueryConfig":{"temporality":"CUMULATIVE"}}
        - id: replicas-in-sync
          title: Replicas In Sync
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"kafka.partition.replicas_in_sync","tags":{"topic":"$__{topic}","partition":"$__{partition}"},"metricType":"SUM","sumsQueryConfig":{"temporality":"CUMULATIVE"}}
