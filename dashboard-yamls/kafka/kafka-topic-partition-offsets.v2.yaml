version: 1
dashboard:
  id: otel-kafka-topic-partition-offsets
  title: Kafka Topic & Partition Offsets
  description: Per-topic and per-partition offsets from the OTel Kafka metrics receiver.
  tags: [otel, kafka, kafkametrics, monitoring]
  vars:
    - name: topic
      type: TAG_VALUE
      tag: topic
    - name: partition
      type: TAG_VALUE
      tag: partition
  rows:
    - id: kafka-offsets
      title: Offsets
      panels:
        - id: current-offset
          title: Current Offset
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"kafka.partition.current_offset","tags":{"topic":"$__{topic}","partition":"$__{partition}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: oldest-offset
          title: Oldest Offset
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"kafka.partition.oldest_offset","tags":{"topic":"$__{topic}","partition":"$__{partition}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
