                {"metric":"clickhouse_query_queue_size","tags":{"service_instance_id":"$__{service_instance_id}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: threads-in-use
          title: Threads In Use
          grammar: OKAPI_JSON
