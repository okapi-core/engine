version: 1
dashboard:
  id: clickhouse-monitoring
  title: ClickHouse Monitoring
  description: ClickHouse query, replication, and storage metrics.
  tags: [clickhouse, monitoring]
  vars:
    - name: service_instance_id
      type: TAG_VALUE
      tag: service_instance_id
  rows:
    - id: clickhouse-queries
      title: Query Activity
      panels:
        - id: queries-total
          title: Queries Total
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"clickhouse_queries_total","tags":{"service_instance_id":"$__{service_instance_id}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: queries-failed
          title: Queries Failed
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"clickhouse_queries_failed","tags":{"service_instance_id":"$__{service_instance_id}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: query-read-rows
          title: Query Read Rows
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"clickhouse_query_read_rows","tags":{"service_instance_id":"$__{service_instance_id}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: query-written-rows
          title: Query Written Rows
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"clickhouse_query_written_rows","tags":{"service_instance_id":"$__{service_instance_id}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: query-read-bytes
          title: Query Read Bytes
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"clickhouse_query_read_bytes","tags":{"service_instance_id":"$__{service_instance_id}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: query-written-bytes
          title: Query Written Bytes
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"clickhouse_query_written_bytes","tags":{"service_instance_id":"$__{service_instance_id}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
    - id: clickhouse-concurrency
      title: Concurrency
      panels:
        - id: current-connections
          title: Current Connections
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"clickhouse_current_connections","tags":{"service_instance_id":"$__{service_instance_id}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: current-queries
          title: Current Queries
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"clickhouse_current_queries","tags":{"service_instance_id":"$__{service_instance_id}"},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: query-queue
