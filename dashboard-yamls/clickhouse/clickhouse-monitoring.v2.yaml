version: 1
dashboard:
  id: otel-clickhouse-monitoring
  title: ClickHouse Monitoring
  description: ClickHouse query, replication, and storage metrics.
  tags: [otel, clickhouse, monitoring]
  vars:
    - name: service_instance_id
      type: TAG_VALUE
      tag: service_instance_id
  rows:
    - id: clickhouse-queries
      title: Query Activity
      panels:
        - id: queries-total
          title: Queries Total
          queries:
            - query: >
                {"metric":"clickhouse.queries.total","start":0,"end":0,"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: queries-failed
          title: Queries Failed
          queries:
            - query: >
                {"metric":"clickhouse.queries.failed","start":0,"end":0,"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: query-read-rows
          title: Query Read Rows
          queries:
            - query: >
                {"metric":"clickhouse.query.read.rows","start":0,"end":0,"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: query-written-rows
          title: Query Written Rows
          queries:
            - query: >
                {"metric":"clickhouse.query.written.rows","start":0,"end":0,"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: query-read-bytes
          title: Query Read Bytes
          queries:
            - query: >
                {"metric":"clickhouse.query.read.bytes","start":0,"end":0,"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: query-written-bytes
          title: Query Written Bytes
          queries:
            - query: >
                {"metric":"clickhouse.query.written.bytes","start":0,"end":0,"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
    - id: clickhouse-concurrency
      title: Concurrency
