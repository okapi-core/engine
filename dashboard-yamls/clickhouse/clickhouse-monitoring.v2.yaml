          title: Current Queries
          queries:
            - query: >
                {"metric":"clickhouse.current.queries","start":0,"end":0,"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: query-queue
          title: Query Queue Size
          queries:
            - query: >
                {"metric":"clickhouse.query.queue.size","start":0,"end":0,"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: threads-in-use
          title: Threads In Use
