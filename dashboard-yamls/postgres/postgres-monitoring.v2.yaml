version: 1
dashboard:
  id: otel-postgres-monitoring
  title: Postgres Monitoring
  description: Postgres connections, transactions, cache, and storage metrics.
  tags: [otel, postgres, monitoring]
  vars:
    - name: service_instance_id
      type: TAG_VALUE
      tag: service_instance_id
  rows:
    - id: postgres-connections
      title: Connections
      panels:
        - id: backends-total
          title: Backends Total
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"postgresql.backends","tags":{},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: backends-active
          title: Backends Active
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"postgresql.backends.active","tags":{},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: backends-idle
          title: Backends Idle
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"postgresql.backends.idle","tags":{},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: max-connections
          title: Max Connections
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"postgresql.max.connections","tags":{},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
    - id: postgres-transactions
      title: Transactions
      panels:
        - id: xact-commits
          title: Transactions Committed
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"postgresql.transactions.committed","tags":{},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: xact-rollbacks
          title: Transactions Rolled Back
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"postgresql.transactions.rolled_back","tags":{},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: xact-total
          title: Transactions Total
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"postgresql.transactions","tags":{},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
    - id: postgres-rows
      title: Row Activity
      panels:
        - id: rows-returned
          title: Rows Returned
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"postgresql.rows.returned","tags":{},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: rows-fetched
          title: Rows Fetched
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"postgresql.rows.fetched","tags":{},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: rows-inserted
          title: Rows Inserted
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"postgresql.rows.inserted","tags":{},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: rows-updated
          title: Rows Updated
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"postgresql.rows.updated","tags":{},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
        - id: rows-deleted
          title: Rows Deleted
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"postgresql.rows.deleted","tags":{},"metricType":"GAUGE","gaugeQueryConfig":{"resolution":"SECONDLY","aggregation":"AVG"}}
