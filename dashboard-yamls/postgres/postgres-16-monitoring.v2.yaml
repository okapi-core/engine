      panels:
        - id: deadlocks
          title: Deadlocks
          grammar: OKAPI_JSON
          queries:
            - query: >
                {"metric":"postgresql.deadlocks","tags":{},"metricType":"SUM","sumsQueryConfig":{"temporality":"CUMULATIVE"}}
