okapi.oscar.memory.enabled=true
okapi.oscar.memory.max-messages=20
okapi.oscar.cluster.endpoint=${OKAPI_CLUSTER_ENDPOINT:http://127.0.0.1:9009}
okapi.oscar.inference.nthreads=5
spring.sql.init.mode=always
