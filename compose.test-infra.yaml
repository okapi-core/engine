name: okapi-test-infra

services:
  clickhouse:
    build:
      context: .
      dockerfile: test-infra/clickhouse/Dockerfile
    image: okapi-test-clickhouse:25.12
    container_name: okapi-clickhouse
    environment:
      CLICKHOUSE_PASSWORD: okapi_testing_password
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - "${OKAPI_CH_DIR:-${HOME}/.okapi-data}/ch_data:/var/lib/clickhouse"
      - "${OKAPI_CH_DIR:-${HOME}/.okapi-data}/ch_logs:/var/log/clickhouse-server"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1'",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - okapi-test-network

  localstack:
    image: localstack/localstack:latest
    container_name: localstack-main
    ports:
      - "4566:4566"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:4566/_localstack/health >/dev/null",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - okapi-test-network

  postgres:
    build:
      context: .
      dockerfile: test-infra/postgres/Dockerfile
    image: okapi-test-postgres:16
    container_name: okapi-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-okapi_oscar}
      POSTGRES_USER: ${POSTGRES_USER:-okapi_oscar_user_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-okapi_oscar_password}
    ports:
      - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - okapi-test-network

  vault:
    image: hashicorp/vault:1.15
    container_name: okapi-vault-dev
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:-0d94159a1b7e9c8f563e4e9e383185dc402ef70e}
    command:
      - server
      - -dev
      - -dev-root-token-id=${VAULT_ROOT_TOKEN:-0d94159a1b7e9c8f563e4e9e383185dc402ef70e}
    ports:
      - "8200:8200"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "VAULT_ADDR=http://127.0.0.1:8200 vault status >/dev/null",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
    networks:
      - okapi-test-network

  vault-init:
    image: hashicorp/vault:1.15
    profiles:
      - init
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN:-0d94159a1b7e9c8f563e4e9e383185dc402ef70e}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - |
        vault secrets enable -path=secret kv-v2 2>/dev/null || true
        vault kv put secret/openai value="$${OPENAI_API_KEY}"
    networks:
      - okapi-test-network

networks:
  okapi-test-network:
    name: okapi-test-infra-network
