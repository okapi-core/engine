apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ingester.fullname" . }}
  labels:
    {{- include "ingester.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ingester.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "ingester.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "ingester.fullname" . }}
      {{- else if .Values.serviceAccount.name }}
      serviceAccountName: {{ .Values.serviceAccount.name }}
      {{- end }}
      containers:
        - name: okapi-ingester
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: SPRING_APPLICATION_JSON
              value: {{ toJson .Values.springOverrides | quote }}
            - name: OKAPI_CLICKHOUSE_HOST
              value: {{ .Values.clickhouse.host | quote }}
            - name: OKAPI_CLICKHOUSE_PORT
              value: {{ .Values.clickhouse.port | quote }}
            - name: OKAPI_CLICKHOUSE_USERNAME
              {{- if .Values.clickhouse.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.existingSecret }}
                  key: {{ .Values.clickhouse.usernameKey }}
              {{- else }}
              value: {{ .Values.clickhouse.username | quote }}
              {{- end }}
            - name: OKAPI_CLICKHOUSE_PASSWORD
              {{- if .Values.clickhouse.existingSecret }}
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.existingSecret }}
                  key: {{ .Values.clickhouse.passwordKey }}
              {{- else }}
              value: {{ .Values.clickhouse.password | quote }}
              {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
