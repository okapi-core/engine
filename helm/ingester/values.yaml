replicaCount: 1

image:
  repository: ghcr.io/okapi-core/ingester
  tag: latest
  pullPolicy: IfNotPresent

clickhouse:
  host: clickhouse
  port: 8123
  username: default
  password: ""
  existingSecret: ""
  usernameKey: username
  passwordKey: password

serviceAccount:
  create: false
  name: ""

service:
  type: ClusterIP
  port: 9009

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: okapi-ingester.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources: {}

nodeSelector: {}

tolerations: []

affinity: {}

podAnnotations: {}

podLabels: {}

env: []

springOverrides: {}

envFrom: []

hpa:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

pdb:
  enabled: false
  minAvailable: 1
