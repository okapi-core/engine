apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clickhouse.fullname" . }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "clickhouse.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "clickhouse.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "clickhouse.labels" . | nindent 8 }}
    spec:
      containers:
        - name: clickhouse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.auth.password | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: native
              containerPort: {{ .Values.service.nativePort }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - clickhouse-client --user default --password "$${CLICKHOUSE_PASSWORD}" --query 'SELECT 1'
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: users
              mountPath: /etc/clickhouse-server/users.d/okapi-test.xml
              subPath: okapi-test.xml
            - name: data
              mountPath: /var/lib/clickhouse
      volumes:
        - name: users
          configMap:
            name: {{ include "clickhouse.fullname" . }}-users
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
