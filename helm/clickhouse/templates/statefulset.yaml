apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "clickhouse.fullname" . }}
  labels:
    {{- include "clickhouse.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "clickhouse.fullname" . }}
  replicas: {{ mul (int .Values.cluster.shards) (int .Values.cluster.replicas) }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "clickhouse.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "clickhouse.labels" . | nindent 8 }}
    spec:
      initContainers:
        - name: configure-macros
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          command:
            - /bin/sh
            - -ec
            - |
              ordinal="${POD_NAME##*-}"
              shard=$((ordinal + 1))
              sed -e "s/__CLUSTER_NAME__/{{ .Values.cluster.name }}/" \
                  -e "s/__SHARD__/${shard}/" \
                  -e "s/__REPLICA__/1/" \
                  /config-template/macros.xml > /config/macros.xml
          volumeMounts:
            - name: config-template
              mountPath: /config-template
            - name: generated-config
              mountPath: /config
      containers:
        - name: clickhouse
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: CLICKHOUSE_PASSWORD
              value: {{ .Values.auth.password | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.httpPort }}
            - name: native
              containerPort: {{ .Values.service.nativePort }}
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -ec
                - clickhouse-client --user default --password "$${CLICKHOUSE_PASSWORD}" --query 'SELECT 1'
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: cluster-config
              mountPath: /etc/clickhouse-server/config.d/okapi-cluster.xml
              subPath: okapi-cluster.xml
            - name: generated-config
              mountPath: /etc/clickhouse-server/config.d/macros.xml
              subPath: macros.xml
            - name: users
              mountPath: /etc/clickhouse-server/users.d/okapi-test.xml
              subPath: okapi-test.xml
            - name: data
              mountPath: /var/lib/clickhouse
      volumes:
        - name: cluster-config
          configMap:
            name: {{ include "clickhouse.fullname" . }}-cluster
        - name: config-template
          configMap:
            name: {{ include "clickhouse.fullname" . }}-macros
        - name: generated-config
          emptyDir: {}
        - name: users
          configMap:
            name: {{ include "clickhouse.fullname" . }}-users
        {{- if not .Values.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
